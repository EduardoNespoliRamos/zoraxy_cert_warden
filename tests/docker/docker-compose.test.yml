services:
  cert-simulator:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.cert-simulator
    environment:
      CERT_DIR: /certs
      CERT_CN: "example.com"
    volumes:
      - certs:/certs

  cert-warden-mock:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.cert-warden-mock
    volumes:
      - test-ca:/test-ca
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 30

  plugin-build:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.plugin
      args:
        VERSION: ${VERSION:-dev}
    volumes:
      - zoraxy-plugin:/opt/zoraxy/plugin
    depends_on:
      - cert-simulator

  zoraxy:
    image: zoraxydocker/zoraxy:${ZORAXY_VERSION:-v3.3.3}
    environment:
      - NOAUTH=true
      - SSL_CERT_FILE=/test-ca/ca.pem
    volumes:
      - zoraxy-config:/opt/zoraxy/config
      - zoraxy-plugin:/opt/zoraxy/plugin
      - certs:/cert_warden_plugin:ro
      - test-ca:/test-ca:ro
    depends_on:
      plugin-build:
        condition: service_completed_successfully
      cert-warden-mock:
        condition: service_healthy
    ports:
      - "8000:8000"

  tests:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.tests
    environment:
      ZORAXY_URL: http://zoraxy:8000
      PLUGIN_ID: com.eduardoramos.zoraxy.certwarden
    volumes:
      - certs:/certs
      - zoraxy-config:/opt/zoraxy/config
      - zoraxy-plugin:/opt/zoraxy/plugin
    depends_on:
      - zoraxy

  e2e:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.e2e
    environment:
      ZORAXY_URL: http://zoraxy:8000
      CERT_WARDEN_CONTROL_URL: http://cert-warden-mock:8080
      E2E_SUITE: ${E2E_SUITE:-compatibility}
      CI: ${CI:-}
    depends_on:
      zoraxy:
        condition: service_started
      cert-warden-mock:
        condition: service_healthy

volumes:
  certs:
  zoraxy-config:
  zoraxy-plugin:
  test-ca:
