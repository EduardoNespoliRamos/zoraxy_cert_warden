name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests
        run: DOCKER=docker make test

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run E2E tests against Zoraxy v3.3.3
        run: DOCKER=docker make e2e-test

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build binaries
        run: DOCKER=docker make build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
