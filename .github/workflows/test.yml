name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zoraxy_version:
          - "v3.3.0"
          - "v3.3.1"
          - "v3.3.2"
          - "v3.3.3"
          - "v3.3.4-rc1"
          - "v3.3.4-rc2"
          - "v3.3.4-rc3"
          - "latest"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Run integration tests
        env:
          ZORAXY_VERSION: ${{ matrix.zoraxy_version }}
        run: make integration-test
      - name: Run E2E tests
        env:
          ZORAXY_VERSION: ${{ matrix.zoraxy_version }}
        run: make e2e-test
