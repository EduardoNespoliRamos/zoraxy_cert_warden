name: Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zoraxy_version:
          - v3.3.0
          - v3.3.1
          - v3.3.2
          - v3.3.3
          - v3.3.4-rc1
          - v3.3.4-rc2
          - v3.3.4-rc3
          - latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests against Zoraxy ${{ matrix.zoraxy_version }}
        run: DOCKER=docker ZORAXY_VERSION=${{ matrix.zoraxy_version }} make integration-test
