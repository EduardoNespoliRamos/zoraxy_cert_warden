name: Tag and Release on Main Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  identify-version:
    name: Identify release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH="$SOURCE_BRANCH"
          if [[ ! "$BRANCH" =~ ^(release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Unexpected source branch: $BRANCH"
            exit 1
          fi
          VERSION="${BASH_REMATCH[2]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    needs: identify-version
    uses: ./.github/workflows/_quality.yml
    with:
      ref: main

  stable-e2e:
    needs: identify-version
    uses: ./.github/workflows/_e2e-compatibility.yml
    with:
      ref: main
      run_canaries: false

  create-tag:
    name: Create release tag
    needs: [identify-version, quality, stable-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.identify-version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  trigger-release:
    name: Trigger release workflow
    needs: [identify-version, create-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger release workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.identify-version.outputs.version }}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$TAG"
