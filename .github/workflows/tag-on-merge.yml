name: Tag and Release on Main Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  identify-version:
    name: Identify release version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ ! "$BRANCH" =~ ^(release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Unexpected source branch: $BRANCH"
            exit 1
          fi
          VERSION="${BASH_REMATCH[2]}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  run-tests:
    name: Run full test suite
    needs: identify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests
        run: DOCKER=docker make test

      - name: Run E2E tests
        run: DOCKER=docker make e2e-test

      - name: Run integration matrix
        run: |
          for version in v3.3.0 v3.3.1 v3.3.2 v3.3.3 v3.3.4-rc1 v3.3.4-rc2 v3.3.4-rc3 latest; do
            DOCKER=docker ZORAXY_VERSION=$version make integration-test
          done

  create-tag:
    name: Create release tag
    needs: [identify-version, run-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.identify-version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  trigger-release:
    name: Trigger release workflow
    needs: [identify-version, create-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger release workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.identify-version.outputs.version }}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$TAG"
