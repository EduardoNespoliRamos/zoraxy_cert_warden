name: Tag on Main Merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  identify-source:
    name: Identify merged release/hotfix branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      should_tag: ${{ steps.extract.outputs.should_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify merged branch via GitHub API
        id: identify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          PR_DATA=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" --jq '.[0]')
          if [[ -z "$PR_DATA" || "$PR_DATA" == "null" ]]; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT

      - name: Extract version
        id: extract
        run: |
          BRANCH="${{ steps.identify.outputs.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION="${BASH_REMATCH[2]}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_tag=true" >> $GITHUB_OUTPUT

  run-tests:
    name: Run full test suite
    needs: identify-source
    if: needs.identify-source.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Run unit tests
        run: DOCKER=docker make test

      - name: Run E2E tests
        run: DOCKER=docker make e2e-test

      - name: Run integration matrix
        run: |
          for version in v3.3.0 v3.3.1 v3.3.2 v3.3.3 v3.3.4-rc1 v3.3.4-rc2 v3.3.4-rc3 latest; do
            DOCKER=docker ZORAXY_VERSION=$version make integration-test
          done

  create-tag:
    name: Create release tag
    needs: [identify-source, run-tests]
    if: needs.identify-source.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.identify-source.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  trigger-release:
    name: Trigger release workflow
    needs: [identify-source, create-tag]
    if: needs.identify-source.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger release workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.identify-source.outputs.version }}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$TAG"
