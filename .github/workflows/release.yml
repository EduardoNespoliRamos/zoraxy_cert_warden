name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.0.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$PUSHED_TAG"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Require an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null

  quality:
    needs: metadata
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}

  stable-e2e:
    needs: metadata
    uses: ./.github/workflows/_e2e-compatibility.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}
      run_canaries: false

  build-release:
    name: Build and publish release
    needs: [metadata, quality, stable-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Build both architectures and verify artifact metadata
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: DOCKER=docker make build-all verify-version
      - name: Generate checksums
        working-directory: dist
        run: sha256sum zoraxy-cert-sync-linux-* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: dist/*
          generate_release_notes: true
